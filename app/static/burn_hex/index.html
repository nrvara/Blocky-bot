<!doctype html>
<html>
  <head>
    <title>upload firmware</title>
    <link href="https://fonts.googleapis.com/css?family=Baloo+Bhaina|Cabin+Sketch|Fugaz+One|Itim|Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <div class="main">
      <div class="wrapper">
        <div class="bot">
          <h1>Upload-o-matic 上傳韌體</h1>
          <p>Picoboard 韌體上傳</p>

          <form id="uploadForm"> 
            <button type="submit" id="uploadBtn">上傳</button>
          </form>
        </div>
        <div class="board">
          <img src="images/ArduinoUno.svg"/>
        </div>
        <div id="pipe"></div>
        <div id="go"></div>
        <div id="progress"></div>
        <div id="gear"><img src="images/gear4.svg"/></div>
      </div>
    </div>
    <script src="js/avrgirl-arduino.global.js" charset="UTF-8"></script>
    <script>
      // Embed Picoboard firmware hex string directly
      const picoboardHex = `
:100000000C945C000C946E000C946E000C946E00F2
:100010000C946E000C946E000C946E000C946E00B0
:100020000C946E000C946E000C946E000C946E0090
:100030000C946E000C946E000C946E000C946E0080
:100040000C946E000C946E000C946E000C946E0070
:100050000C946E000C946E000C946E000C946E0060
:100060000C946E000C946E000C946E000C946E0050
:100070000C946E000C946E000C946E000C946E0040
:00000001FF
`;
      function handleSubmit(e) {
        e.preventDefault();
        // Always use Picoboard
        const hexStr = picoboardHex;
        let avrgirl = new AvrgirlArduino({
          board: 'picoboard',
          debug: true
        });
        gear.classList.add('spinning');
        const filecontents = new TextEncoder().encode(hexStr);
        avrgirl.flash(filecontents, (error) =>  {
          gear.classList.remove('spinning');
          progress.textContent = "done!";
          if (error) {
            console.error(error);
            alert('fail 失敗');
          } else {
            console.info('done correctly.');
            alert('upload complate 上傳完成');
          }
        });
      }

      const uploadForm = document.getElementById('uploadForm');
      const uploadBtn = document.getElementById('uploadBtn');
      const progress = document.getElementById('progress');
      const gear = document.getElementById('gear');

      uploadForm.addEventListener('submit', handleSubmit, false);
    </script>
  </body>
</html>
