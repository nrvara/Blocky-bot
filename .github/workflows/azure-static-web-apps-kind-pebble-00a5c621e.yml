name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master2
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master2

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Clean node_modules and lock files
        run: rm -rf node_modules package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Copy files
        run: npm run copy
      - name: Copy webserialEsp32 extension to app root (no extension)
        run: cp app/scratch-vm/src/extensions/scratch3_webserialEsp32/index.js app/webserialEsp32
      - name: Make build-swa.sh executable
        run: chmod +x build-swa.sh
      - name: Build project
        run: ./build-swa.sh
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: 'upload'
          app_location: "app"
          output_location: "app"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_00A5C621E }}
          action: "close"
